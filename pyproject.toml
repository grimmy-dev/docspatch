[project]
name = "docspatch"
version = "0.1.0"
description = "BYOK CLI to auto-generate Python docstrings from git diffs"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
authors = [{ name = "grimmy_dev" }]
keywords = ["docstrings", "documentation", "llm", "cli", "git"]
dependencies = [
    "gitpython>=3.1",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-openai>=0.3",
    "langgraph>=1.1.9",
    "langgraph-checkpoint-sqlite>=2.0",
    "libcst>=1.0",
    "pathspec>=0.12",
    "pydantic>=2",
    "questionary>=2.1.1",
    "rich>=15.0.0",
    "tomli-w>=1.0",
    "typer>=0.24.2",
]

[project.scripts]
dp = "src.cli.main:app"
docspatch = "src.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 140

[tool.mypy]
strict = true
mypy_path = "."
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/cli/banner.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "mypy>=1.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.0",
    "pytest-cov>=5.0",
    "ruff>=0.15.12",
]
